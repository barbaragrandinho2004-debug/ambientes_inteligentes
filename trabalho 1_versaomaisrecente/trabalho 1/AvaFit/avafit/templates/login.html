{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AvaFit - Login</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-main: #2d3436;
            --text-sub: #636e72;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'SF Pro Display', sans-serif;
            background: var(--primary-gradient);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; color: var(--text-main);
        }

        .mobile-screen {
            width: 100%; max-width: 420px; height: 100vh;
            background-image: 
                linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 100%),
                url('/media/fundo_quarto.jpg');
            background-size: cover; background-position: center;
            position: relative; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        @media (min-width: 421px) {
            .mobile-screen { height: 90vh; border-radius: 30px; border: 12px solid #333; }
        }

        .login-panel {
            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 30px; padding: 40px 25px;
            width: 100%; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .login-panel h1 { margin: 0 0 10px 0; font-size: 2.2em; color: #764ba2; font-weight: 800; }
        .login-panel p { margin: 0 0 30px 0; color: var(--text-sub); font-size: 1.1em; }
        
        .mascot-preview { width: 120px; margin-bottom: 20px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1)); }

        .google-btn {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            background: white; color: var(--text-main);
            border: 1px solid #ddd; padding: 15px; border-radius: 20px;
            font-size: 1.1em; font-weight: 700; cursor: pointer;
            text-decoration: none; width: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .google-btn:active { transform: scale(0.97); }
        .google-btn img { width: 24px; height: 24px; }
    </style>
</head>
<body>
    <div class="mobile-screen">
        
        <div id="splash-screen" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #d8d8e3; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; border-radius: inherit;">
            <img src="/media/feliz.gif" alt="AvaFit Ícone" style="width: 130px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));">
        </div>
        <div class="login-panel">
            <img src="/media/feliz.gif" alt="AvaFit Mascot" class="mascot-preview">
            
            <h1>AvaFit</h1>
            <p>O teu assistente inteligente de saúde</p>

            <a href="{% url 'ligar_google_fit' %}" class="google-btn">
                <img src="/media/Google_G_logo.svg.png" alt="Google Logo" style="width: 24px; height: 24px;">
                Entrar com Google
            </a>
            <p style="font-size: 0.8em; color: gray; margin-top: 20px;">
                Acesso exclusivo via conta Google para sincronização com o Google Fit.
            </p>
        </div>
    </div>

    <script>
        // Lógica da Animação do Splash Screen
        // Espera 1.2 segundos (1200 milissegundos)
        setTimeout(function() {
            var splash = document.getElementById('splash-screen');
            splash.style.opacity = '0'; // Começa a desvanecer suavemente
            
            // Espera mais meio segundo para a animação de desaparecer terminar e remove a cortina de vez
            setTimeout(function() {
                splash.style.display = 'none';
            }, 500);
        }, 1200);
    </script>
</body>
</html>
